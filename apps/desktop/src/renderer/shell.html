<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperNode</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="app">
  <!-- Titlebar spacer for macOS hiddenInset traffic lights -->
  <div id="titlebar"></div>

  <!-- Unified content area — sidebar is part of the same surface -->
  <div id="main">
    <!-- Sidebar -->
    <aside id="sidebar">
      <!-- Claude-style tab navigation: text labels + underline indicator -->
      <nav id="tabs">
        <button class="tab active" data-mode="agent">Agent</button>
        <button class="tab" data-mode="agenthubs">AgentHubs</button>
      </nav>

      <div class="sidebar-divider"></div>

      <!-- Organization info panel -->
      <section id="org-panel">
        <div id="org-name">AgentHubs</div>
        <div id="org-role">Owner</div>
        <div id="org-balance">Loading...</div>
      </section>

      <div class="sidebar-divider"></div>

      <div id="sidebar-content">
        <!-- Service status -->
        <div id="services">
          <div class="service-row" id="svc-agent">
            <span class="dot loading"></span>
            <span class="svc-label">Agent Daemon</span>
            <span class="svc-meta" id="agent-port"></span>
          </div>
          <div class="service-row" id="svc-agenthubs">
            <span class="dot offline"></span>
            <span class="svc-label">AgentHubs VM</span>
            <span class="svc-meta" id="agenthubs-desc">not running</span>
          </div>
        </div>

        <!-- AgentHubs VM empty state (hidden by default) -->
        <div id="agenthubs-empty">
          <p class="empty-title">VM Not Available</p>
          <p class="empty-desc">Download the AgentHubs VM bundle to enable local AgentHubs mode.</p>
          <button id="btn-download-vm">Download VM</button>
          <div class="vm-progress hidden" id="vm-progress-area">
            <div class="vm-progress-bar">
              <div class="vm-progress-fill" id="vm-progress-fill"></div>
            </div>
            <div class="vm-progress-stats" id="vm-progress-stats">0%</div>
          </div>
        </div>
      </div>

      <!-- Bottom bar -->
      <div id="sidebar-footer">
        <span id="user-email">...</span>
        <button id="btn-signout">Sign Out</button>
      </div>
    </aside>

    <!-- Content placeholder (WebContentsView overlays this area) -->
    <main id="content">
      <div id="content-empty">
        <svg width="48" height="48" viewBox="0 0 100 100" fill="none" opacity="0.12">
          <path d="M15,80 L50,10 L85,80 Z" fill="currentColor" opacity="0.9"/>
          <path d="M35,80 L65,80 L50,35 Z" fill="currentColor" opacity="1"/>
        </svg>
      </div>
    </main>
  </div>
</div>

<script src="shell.js"></script>
</body>
</html>
