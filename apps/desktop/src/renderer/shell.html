<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperClip Sidebar</title>
  <link rel="stylesheet" href="shell.css" />
  <script src="shell.js" defer></script>
</head>
<body>
  <!-- Welcome Screen — shown on first load, hidden after mode selection -->
  <div id="welcome-screen">
    <div class="welcome-title">Welcome to Super Node</div>
    <div class="welcome-cards">
      <!-- Agent Mode Card -->
      <div class="welcome-card" id="card-agent">
        <div class="welcome-card-icon">🚀</div>
        <div class="welcome-card-title">Agent Mode</div>
        <div class="welcome-card-desc">Manage AI agents with no extra setup</div>
        <button class="welcome-card-btn" id="btn-start-agent">Start Now</button>
      </div>

      <!-- AgentHubs Mode Card -->
      <div class="welcome-card" id="card-agenthubs">
        <div class="welcome-card-icon">📦</div>
        <div class="welcome-card-title">AgentHubs Mode</div>
        <div class="welcome-card-desc">Orders + collaboration via VM (20MB)</div>
        <button class="welcome-card-btn" id="btn-start-agenthubs">Enter AgentHubs</button>
        <button class="welcome-card-btn" id="btn-download-agenthubs" style="display: none;">Download VM (20MB)</button>
        <!-- VM Download Progress (hidden unless downloading) -->
        <div class="vm-progress-area hidden" id="vm-progress-area">
          <div class="vm-progress-bar">
            <div class="vm-progress-bar-fill" id="vm-progress-fill"></div>
          </div>
          <div class="vm-progress-stats" id="vm-progress-stats">0% — 0 MB/s — --:--</div>
          <div class="vm-progress-actions">
            <button class="welcome-card-btn-secondary" id="btn-vm-retry">Retry</button>
            <button class="welcome-card-btn-secondary" id="btn-vm-skip">Skip</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar — hidden initially, shown after mode selection -->
  <aside id="sidebar">
    <!-- macOS traffic light titlebar spacer -->
    <div class="titlebar"></div>

    <!-- Tab navigation -->
    <nav id="tab-nav">
      <button class="tab active" data-mode="agenthubs">AgentHubs</button>
      <button class="tab" data-mode="agent">Agent</button>
    </nav>

    <div class="sidebar-divider"></div>

    <!-- Organization info panel -->
    <section id="org-panel">
      <div id="org-name">AgentHubs</div>
      <div id="org-role">Owner</div>
      <div id="org-balance">Loading...</div>
    </section>

    <div class="sidebar-divider"></div>

    <!-- Status panel -->
    <section id="status-panel">
      <div class="status-item" id="daemon-status">
        <span class="status-dot loading"></span>
        <span class="status-label">Agent Daemon</span>
      </div>
      <div class="status-item" id="agenthubs-status">
        <span class="status-dot loading"></span>
        <span class="status-label">AgentHubs</span>
      </div>
      <div id="vm-download-area" style="display: none;">
        <button id="btn-download-vm">Download VM (20MB)</button>
        <div id="vm-download-progress" class="download-progress"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer id="sidebar-footer">
      <div id="user-email">...</div>
      <button id="btn-logout">Sign Out</button>
    </footer>
  </aside>
</body>
</html>
